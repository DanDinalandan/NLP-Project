[package]
name = "reviewbot"
version = "0.1.0"
description = "ReviewBot - AI-powered offline study app"
authors = []
license = ""
repository = ""
default-run = "reviewbot"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "reviewbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
